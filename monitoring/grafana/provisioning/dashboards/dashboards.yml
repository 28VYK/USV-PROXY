# ─────────────────────────────────────────────────────────────────────────────
# Grafana Auto-Provisioning: Dashboard Provider
# Grafana will automatically load all .json files from /var/lib/grafana/dashboards,
# which is mounted from ./monitoring/grafana/dashboards/ on the host.
# ─────────────────────────────────────────────────────────────────────────────

apiVersion: 1

providers:
  - name: 'USV Proxy Dashboards'
    orgId: 1
    folder: 'USV Infrastructure'
    folderUid: 'usv-infra'
    type: file
    disableDeletion: true
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
