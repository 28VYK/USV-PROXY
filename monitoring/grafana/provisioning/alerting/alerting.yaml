# ─────────────────────────────────────────────────────────────────────────────
# Grafana Auto-Provisioning: Alerting Configuration
# Configures Telegram alerts and Prometheus metric warning triggers.
# ─────────────────────────────────────────────────────────────────────────────

apiVersion: 1

contactPoints:
  - orgId: 1
    name: "infra-alerts"
    receivers:
      - uid: "telegram-alerts"
        type: "telegram"
        disableResolveMessage: false
        settings:
          bottoken: "${TELEGRAM_BOT_TOKEN}"
          chatid: "${TELEGRAM_CHAT_ID}"

policies:
  - orgId: 1
    receiver: "infra-alerts"
    group_by: ["alertname", "grafana_folder"]
    group_wait: "5s"
    group_interval: "10s"
    repeat_interval: "4h"

groups:
  - orgId: 1
    name: "USV Infrastructure Alerts"
    folder: "Production Alerts"
    interval: "10s"
    rules:
      # Alert 1: VPS Host Down (Node Exporter Offline)
      - uid: "vps_host_down"
        title: "🚨 Alert: VPS Host Down"
        condition: "A"
        data:
          - refId: "A"
            datasourceUid: "prometheus"
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: 'up{job="node-exporter"} == 0'
              refId: "A"
              type: "query"
        for: "10s"
        annotations:
          summary: "VPS Host is unreachable or offline."
          description: "Prometheus has lost contact with the physical VPS server node-exporter probe."
        labels:
          severity: "critical"

      # Alert 2: Proxy Backend Offline (Next.js crashing / offline)
      - uid: "nextjs_proxy_down"
        title: "⚠️ Warning: Next.js Backend Offline"
        condition: "A"
        data:
          - refId: "A"
            datasourceUid: "prometheus"
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: 'caddy_reverse_proxy_upstreams_healthy{upstream="usv-vpn:3000"} == 0'
              refId: "A"
              type: "query"
        for: "10s"
        annotations:
          summary: "Next.js backend container is unreachable or offline."
          description: "Caddy reverse proxy reports the Next.js upstream container is unhealthy."
        labels:
          severity: "critical"
