# ─────────────────────────────────────────────────────────────────────────────
# Loki Configuration — Production Logs Engine
# ─────────────────────────────────────────────────────────────────────────────

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Increase limits to prevent 429 errors when loading large log history on startup
  ingestion_rate_mb: 20
  ingestion_burst_size_mb: 40
  max_query_length: 744h # 31 days

analytics:
  # Disable telemetry tracking
  reporting_enabled: false
