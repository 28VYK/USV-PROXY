<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal USV — Mentenanță</title>
    <!-- Favicon & Icons -->
    <link rel="icon" href="/favicon.ico" sizes="48x48 96x96 144x144 192x192">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <link rel="shortcut icon" href="/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;700;800;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(180deg, #f8fafc 0%, #f1f5f9 50%, #e2e8f0 100%);
            --ink: #0f172a;
            --text: #334155;
            --muted: #64748b;
            --blue: #254AA5;
            --blue-rgb: 37, 74, 165;
            
            --card-bg: rgba(255, 255, 255, 0.82);
            --card-border: rgba(255, 255, 255, 0.6);
            --card-inner-shadow: rgba(255, 255, 255, 0.8);
            
            --glow-1: rgba(37, 74, 165, 0.12);
            --glow-2: rgba(16, 185, 129, 0.10);
            
            --line: #e2e8f0;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-gradient: linear-gradient(180deg, #0f172a 0%, #0b0f19 50%, #020617 100%);
                --ink: #f8fafc;
                --text: #cbd5e1;
                --muted: #64748b;
                --blue: #4f78e2;
                --blue-rgb: 79, 120, 226;
                
                --card-bg: rgba(11, 15, 25, 0.8);
                --card-border: rgba(255, 255, 255, 0.08);
                --card-inner-shadow: rgba(255, 255, 255, 0.05);
                
                --glow-1: rgba(79, 120, 226, 0.12);
                --glow-2: rgba(52, 211, 153, 0.10);
                
                --line: #1e293b;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-gradient);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            -webkit-font-smoothing: antialiased;
        }

        /* Ambient Glow Blobs */
        .glow-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(130px);
            z-index: 1;
            pointer-events: none;
            mix-blend-mode: multiply;
            animation: pulse 10s ease-in-out infinite alternate;
        }

        .glow-blob-1 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, var(--glow-1) 0%, rgba(135, 194, 234, 0) 70%);
            top: -10%;
            left: 10%;
        }

        .glow-blob-2 {
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, var(--glow-2) 0%, rgba(56, 189, 248, 0) 70%);
            bottom: 0%;
            right: 5%;
            animation-delay: -5s;
        }

        @keyframes pulse {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, -40px) scale(1.15); }
        }

        .container {
            position: relative;
            z-index: 5;
            width: 100%;
            max-width: 440px;
            padding: 20px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow:
                0 30px 60px rgba(15, 23, 42, 0.05),
                0 12px 24px rgba(15, 23, 42, 0.03),
                inset 0 1px 0 var(--card-inner-shadow);
            padding: 44px 36px;
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow:
                0 35px 70px rgba(15, 23, 42, 0.07),
                0 15px 30px rgba(15, 23, 42, 0.04),
                inset 0 1px 0 var(--card-inner-shadow);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(24px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .icon-wrapper {
            width: 80px;
            height: 80px;
            margin: 0 auto 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(var(--blue-rgb), 0.06);
            border: 2px solid rgba(var(--blue-rgb), 0.12);
            color: var(--blue);
            position: relative;
        }

        .icon-wrapper svg {
            animation: gear-spin 8s linear infinite;
        }

        @keyframes gear-spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 28px;
            font-weight: 900;
            margin: 0 0 14px;
            color: var(--ink);
            letter-spacing: -0.03em;
        }

        p {
            color: var(--muted);
            font-size: 14.5px;
            line-height: 1.65;
            margin-bottom: 28px;
            font-weight: 500;
        }

        /* Footer Disclaimer */
        .disclaimer {
            padding-top: 16px;
            border-top: 1px dashed var(--line);
        }

        .disclaimer p {
            margin: 0;
            font-size: 12px;
            color: var(--muted);
            font-weight: 500;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="glow-blob glow-blob-1"></div>
    <div class="glow-blob glow-blob-2"></div>

    <div class="container">
        <div class="card">
            <div class="icon-wrapper">
                <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
            </div>
            <h1>Mentenanță Sistem</h1>
            <p>Portalul USV este temporar indisponibil pentru lucrări de mentenanță și optimizări. Serviciul va fi restaurat în cel mai scurt timp posibil.</p>

            <div class="disclaimer">
                <p>Vă mulțumim pentru înțelegere. Conexiunea se va restabili automat de îndată ce operațiunile sunt finalizate.</p>
            </div>
        </div>
    </div>

    <script>
        // Optional: Auto-check if portal is back online every 30s
        setInterval(async () => {
            try {
                const res = await fetch('/?t=' + Date.now());
                const text = await res.text();
                // If Caddy returns success and it is NOT our maintenance or error page
                if (res.ok && !text.includes('Portal USV — Mentenanță') && !text.includes('Portal USV — Temporar Indisponibil')) {
                    window.location.reload();
                }
            } catch (e) {}
        }, 30000);
    </script>
</body>
</html>
