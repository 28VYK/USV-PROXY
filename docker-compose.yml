version: '3.8'

services:
  usv-proxy:
    build: .
    container_name: usv-proxy
    ports:
      - "${HOST_PORT:-3001}:3000"
    restart: always
    
    # Required capabilities and devices for OpenVPN split-tunneling inside the container
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
      
    # Pass VPN credentials and configurations
    environment:
      - VPN_USER=${VPN_USER:-}
      - VPN_PASS=${VPN_PASS:-}
    
    # Mount persistent folder for OpenVPN configuration and logs
    volumes:
      - ./vpn:/app/vpn
      
    # Clear memory limits applied at the Docker daemon level to ensure VPS stability (OOM prevention)
    deploy:
      resources:
        limits:
          memory: 180M
        reservations:
          memory: 50M
