version: '3.8'

services:
  usv-proxy:
    build: .
    container_name: usv-proxy
    expose:
      - "3000"
    restart: always
    
    # Required capabilities and devices for OpenVPN split-tunneling inside the container
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
      
    # Load all credentials from .env (gitignored - VPN and environment variables stay private)
    env_file:
      - .env
    
    # Mount persistent folder for OpenVPN configuration and logs
    volumes:
      - ./vpn:/app/vpn
      
    # Clear memory limits applied at the Docker daemon level to ensure VPS stability (OOM prevention)
    deploy:
      resources:
        limits:
          memory: 180M
        reservations:
          memory: 50M

  usv-proxy-ssl:
    image: caddy:2-alpine
    container_name: usv-proxy-ssl
    ports:
      - "${HOST_PORT:-8080}:8080"
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./certs/origin.pem:/etc/caddy/certs/origin.pem
      - ./certs/origin.key:/etc/caddy/certs/origin.key
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    restart: always
    depends_on:
      - usv-proxy

volumes:
  caddy_data:
  caddy_config:
  caddy_logs:
