
# ─────────────────────────────────────────────────────────────────────────────
# Monitoring Stack: Prometheus + Grafana + Node Exporter
#
# Run SEPARATELY from the main docker-compose.yml:
#   docker compose -f docker-compose.monitoring.yml up -d
#
# Prerequisite (one-time on the VPS):
#   docker network create monitoring_net
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ───────────────────────────────────────────────────────────────────────────
  # node-exporter: Exposes HOST system metrics (CPU, RAM, Disk, Network).
  # Runs on the host network to read /proc and /sys from the physical machine.
  # Prometheus reaches it via host-gateway rather than monitoring_net directly.
  # ───────────────────────────────────────────────────────────────────────────
  node-exporter:
    image: prom/node-exporter:v1.8.0
    container_name: usv-node-exporter
    restart: always

    # Share the host's kernel namespaces for complete system metrics
    pid: host
    
    # Joined to the internal monitoring network to avoid exposing port 9100 on host interfaces
    networks:
      - monitoring_net

    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro

    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      # Exclude virtual filesystems from disk metrics
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 100M
        reservations:
          memory: 10M

  # ───────────────────────────────────────────────────────────────────────────
  # prometheus: Time-series database. Scrapes Caddy + Node Exporter.
  # Not exposed publicly on the host — accessed internally by Grafana.
  # ───────────────────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: usv-prometheus
    restart: always

    # host-gateway allows reaching node-exporter running on the host network
    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/metrics_token.txt:/etc/prometheus/metrics_token.txt:ro
      - prometheus_data:/prometheus

    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'

    networks:
      - monitoring_net

    depends_on:
      - node-exporter
      - cadvisor
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1000M
        reservations:
          memory: 100M

  # ───────────────────────────────────────────────────────────────────────────
  # cadvisor: Exposes docker container metrics (CPU, Memory, Network, Disk).
  # ───────────────────────────────────────────────────────────────────────────
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: usv-cadvisor
    restart: always
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - monitoring_net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 300M
        reservations:
          memory: 30M

  # ───────────────────────────────────────────────────────────────────────────
  # grafana: Visual dashboards. Connected to Prometheus as a datasource.
  # Not exposed on the host — Caddy reverse-proxies it at stats.noteusv.tech.
  # Admin credentials come EXCLUSIVELY from .env — no hardcoded passwords.
  # ───────────────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana-oss:11.1.0
    container_name: usv-grafana
    restart: always

    environment:
      # Admin credentials injected from .env
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      # Disable public self-registration
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_USERS_DEFAULT_THEME=dark
      # Public URL of this instance (used for correct links in alerts, etc.)
      - GF_SERVER_ROOT_URL=https://stats.noteusv.tech
      - GF_SERVER_SERVE_FROM_SUB_PATH=false
      # Hide Grafana version from HTTP headers (minor security hardening)
      - GF_SECURITY_HIDE_VERSION=true
      # Disable Grafana telemetry
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      # Enable environment variable substitution in provisioning configurations
      - GF_PROVISIONING_ENV_VARS_SUBSTITUTION=true
      # Telegram credentials for alerting contact point
      - TELEGRAM_BOT_TOKEN=${ALERTING_TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}

    volumes:
      - grafana_data:/var/lib/grafana
      # Auto-provisioning: Prometheus datasource + dashboard files
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      # Dashboard JSON files (downloaded by monitoring/setup.sh)
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro

    networks:
      - monitoring_net

    depends_on:
      - prometheus
      - loki
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 500M
        reservations:
          memory: 50M

  # ───────────────────────────────────────────────────────────────────────────
  # loki: Log aggregation engine.
  # Not exposed publicly — accessed internally by Grafana.
  # ───────────────────────────────────────────────────────────────────────────
  loki:
    image: grafana/loki:3.0.0
    container_name: usv-loki
    restart: always
    volumes:
      - loki_data:/loki
      - ./monitoring/loki/config.yml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - monitoring_net
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1500M
        reservations:
          memory: 200M

  # ───────────────────────────────────────────────────────────────────────────
  # promtail: Scrapes Caddy logs in real time and pushes them to Loki.
  # ───────────────────────────────────────────────────────────────────────────
  promtail:
    image: grafana/promtail:3.0.0
    container_name: usv-promtail
    restart: always
    volumes:
      - ./monitoring/promtail/config.yml:/etc/promtail/config.yml:ro
      - caddy_logs:/var/log/caddy:ro
      - promtail_data:/data
    command: -config.file=/etc/promtail/config.yml
    networks:
      - monitoring_net
    depends_on:
      - loki
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 200M
        reservations:
          memory: 20M

volumes:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local
  promtail_data:
    driver: local
  caddy_logs:
    name: ${CADDY_LOGS_VOLUME:-usv-proxy_caddy_logs}
    external: true

networks:
  monitoring_net:
    external: true

